version: '3.8'

services:
  app:
    build: .
    ports:
      - "3019:3019"
    environment:
      - DATABASE_URI=postgresql://payload:password@db:5432/payload
      - PAYLOAD_SECRET=your-32-character-secret-key-here-change-me
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3019
      - NEXT_PUBLIC_SITE_NAME=Healthy Lifestyle Tips
      - NEXT_PUBLIC_SITE_DESCRIPTION=Your trusted source for evidence-based health and wellness information
      - CRON_SECRET=your-cron-secret-key-here-change-me
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=payload
      - POSTGRES_USER=payload
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
