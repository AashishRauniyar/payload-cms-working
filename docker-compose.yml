services:

  # PostgreSQL Database
  postgres:

    image: postgres:15-alpine
    container_name: payload-postgres
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - payload-network

  # Payload CMS Application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: payload-app
    ports:
      - "3019:3019"
    environment:
      - DATABASE_URI=postgresql://payload:password123@postgres:5432/payload
      - PAYLOAD_SECRET=your-32-character-secret-key-here-change-me-for-production
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=https://healthylifestyletips.online
      - NEXT_PUBLIC_SITE_NAME=Healthy Lifestyle Tips
      - NEXT_PUBLIC_SITE_DESCRIPTION=Your trusted source for evidence-based health and wellness information
      - CRON_SECRET=YOUR_CRON_SECRET_HERE
      - PREVIEW_SECRET=your-preview-secret-here-change-me
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - media_data:/app/public/media
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payload-network
    # Run migrations then start the server
    command: >
      sh -c "
        echo '🚀 Starting Payload CMS application...' &&
        node migrate.js &&
        echo '✅ Starting server...' &&
        exec node server.js
      "

volumes:
  postgres_data:
  media_data:
  uploads_data:

networks:
  payload-network:
    driver: bridge
